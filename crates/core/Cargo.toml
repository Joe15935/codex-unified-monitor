[package]
name = "codexmeter-core"
version = "0.2.1"
edition = "2021"
license = "MIT"
description = "Read-only local Codex accounting, incremental storage, and quota adapters"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
dirs = "6"
walkdir = "2"
iana-time-zone = "0.1"

[[bin]]
name = "codexmeter-data"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
